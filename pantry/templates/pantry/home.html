<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Forward</title>
  <style>
    body { max-width: 40rem; margin: 0 auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    input[name="names"] { width: 100%; max-width: 20rem; box-sizing: border-box; }
    .recipes { display: grid; gap: 1rem; }
    .recipe-card { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem 1rem; overflow-wrap: break-word; }
    .recipe-card h3 { margin: 0 0 0.5rem; }
    .recipe-card h4 { margin: 0.5rem 0 0.25rem; font-size: 1rem; }
    .recipe-card ul, .recipe-card ol { margin: 0.25rem 0; padding-left: 1.5rem; }
    .recipe-card summary { cursor: pointer; font-weight: 600; padding: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Fridge Forward</h1>

  <h2>What's in your fridge?</h2>
  {# Works as a normal form without JavaScript; with HTMX it updates the page in place (SR-2.5). #}
  <form method="post" action="{% url 'add_ingredient' %}"
        hx-post="{% url 'add_ingredient' %}" hx-target="#fridge-and-suggestions" hx-swap="outerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    {% csrf_token %}
    <label for="ingredient-input">Add an ingredient</label>
    <input id="ingredient-input" name="names" list="known" placeholder="e.g. eggs, milk, cheese" autofocus autocomplete="off">
    <button type="submit">Add</button>
  </form>

  {% include "pantry/_fridge_and_suggestions.html" %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"
          integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
